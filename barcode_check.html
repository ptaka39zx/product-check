<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>製品番号照合（バーコード）</title>
<style>
  :root {
    --bg: #F5F4F0; --surface: #FFF; --border: #E0DED8;
    --text: #1A1A18; --text-sub: #6B6A65;
    --ok: #0F6E56; --ok-bg: #E1F5EE;
    --ng: #993C1D; --ng-bg: #FAECE7;
    --accent: #1D9E75; --radius: 12px; --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; background: #000; color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  header { background: rgba(0,0,0,0.85); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 10; }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .logo { width: 28px; height: 28px; background: var(--accent); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  header h1 { font-size: 15px; font-weight: 600; color: #fff; }
  .end-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #fff; font-size: 13px; cursor: pointer; font-family: inherit; }

  .cam-wrap { flex: 1; position: relative; overflow: hidden; }
  #mainVideo { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* スキャン枠 */
  .scan-overlay { position: absolute; inset: 0; pointer-events: none; }
  .scan-dim { position: absolute; background: rgba(0,0,0,0.5); }
  .scan-dim.top    { top: 0; left: 0; right: 0; height: 30%; }
  .scan-dim.bottom { bottom: 0; left: 0; right: 0; height: 40%; }
  .scan-dim.left   { top: 30%; left: 0; width: 5%; height: 30%; }
  .scan-dim.right  { top: 30%; right: 0; width: 5%; height: 30%; }
  .scan-frame {
    position: absolute; top: 30%; left: 5%; width: 90%; height: 30%;
    border: 2px solid var(--accent);
    border-radius: 4px;
  }
  .scan-line {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    animation: scanline 2s ease-in-out infinite;
  }
  @keyframes scanline { 0%,100%{top:5%} 50%{top:90%} }
  .scan-corner { position: absolute; width: 16px; height: 16px; border-color: #fff; border-style: solid; }
  .scan-corner.tl { top:-1px; left:-1px; border-width: 3px 0 0 3px; }
  .scan-corner.tr { top:-1px; right:-1px; border-width: 3px 3px 0 0; }
  .scan-corner.bl { bottom:-1px; left:-1px; border-width: 0 0 3px 3px; }
  .scan-corner.br { bottom:-1px; right:-1px; border-width: 0 3px 3px 0; }

  /* ステップバー */
  .step-bar { position: absolute; top: 0; left: 0; right: 0; padding: 10px 14px; display: flex; align-items: center; gap: 8px; background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent); }
  .step-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; transition: background 0.3s; }
  .step-dot.active { background: var(--accent); color: #fff; }
  .step-dot.done   { background: rgba(255,255,255,0.35); color: #fff; }
  .step-dot.wait   { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.4); }
  .step-line { flex: 1; height: 2px; background: rgba(255,255,255,0.2); border-radius: 1px; transition: background 0.3s; }
  .step-line.done { background: rgba(255,255,255,0.5); }
  .step-label { font-size: 13px; color: #fff; font-weight: 500; }

  /* ガイド */
  .guide-area { position: absolute; top: 62%; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .guide-chip { background: rgba(0,0,0,0.55); color: #fff; font-size: 13px; padding: 5px 14px; border-radius: 14px; }
  .scanned-chip { background: rgba(29,158,117,0.85); color: #fff; font-size: 12px; font-family: monospace; padding: 4px 12px; border-radius: 10px; max-width: 90%; text-align: center; word-break: break-all; display: none; }

  /* 手入力 */
  .manual-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 16px 28px; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .mode-toggle { display: flex; gap: 6px; }
  .mode-btn { padding: 5px 14px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.25); background: transparent; color: rgba(255,255,255,0.6); font-size: 12px; cursor: pointer; font-family: inherit; }
  .mode-btn.active { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.4); }
  .manual-row { display: none; width: 100%; max-width: 320px; gap: 8px; }
  .manual-row.show { display: flex; }
  .manual-input { flex: 1; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: #fff; font-size: 15px; font-family: monospace; letter-spacing: 0.05em; text-transform: uppercase; }
  .manual-input::placeholder { color: rgba(255,255,255,0.25); }
  .manual-input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .manual-submit { padding: 10px 16px; border-radius: var(--radius-sm); background: var(--accent); color: #fff; border: none; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }

  /* 処理中 */
  .processing { position: absolute; top: 30%; left: 5%; width: 90%; height: 30%; display: none; align-items: center; justify-content: center; background: rgba(29,158,117,0.25); border-radius: 4px; }
  .processing.show { display: flex; }
  .processing-text { color: #fff; font-size: 14px; font-weight: 500; }

  /* 結果パネル */
  .result-panel { position: absolute; inset: 0; background: rgba(0,0,0,0.88); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
  .result-panel.show { display: flex; }
  .result-icon { font-size: 72px; line-height: 1; }
  .result-title { font-size: 22px; font-weight: 700; text-align: center; }
  .result-title.ok { color: #4AE8A0; }
  .result-title.ng { color: #FF6B4A; }
  .result-nums { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 6px; }
  .result-num-row { background: rgba(255,255,255,0.1); border-radius: var(--radius-sm); padding: 10px 14px; }
  .result-num-label { font-size: 10px; color: rgba(255,255,255,0.5); margin-bottom: 3px; }
  .result-num-val { font-size: 16px; font-family: monospace; font-weight: 600; color: #fff; letter-spacing: 0.05em; }
  .result-num-val.ng { color: #FF6B4A; }
  .result-next-btn { margin-top: 8px; padding: 14px 40px; border-radius: 30px; background: var(--accent); color: #fff; border: none; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .result-countdown { font-size: 12px; color: rgba(255,255,255,0.45); }

  /* スタート画面 */
  .start-screen { position: absolute; inset: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 32px; z-index: 20; }
  .start-logo { width: 80px; height: 80px; background: var(--accent); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .start-title { font-size: 22px; font-weight: 700; color: #fff; }
  .start-sub { font-size: 13px; color: rgba(255,255,255,0.5); text-align: center; line-height: 2; }
  .start-btn { padding: 16px 48px; border-radius: 30px; background: var(--accent); color: #fff; border: none; font-size: 17px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .beep-flash { position: absolute; inset: 0; background: rgba(255,255,255,0.3); pointer-events: none; opacity: 0; transition: opacity 0.1s; }
  .beep-flash.flash { opacity: 1; }
</style>
</head>
<body>

<!-- スタート画面 -->
<div class="start-screen" id="startScreen">
  <div class="start-logo">📊</div>
  <div class="start-title">バーコード照合</div>
  <div class="start-sub">
    バーコードをスキャンして<br>
    1枚目・2枚目の製品番号を自動照合します<br><br>
    <span style="color:rgba(255,255,255,0.3);font-size:11px;">※ 伝票にCode128/QRバーコードが必要です</span>
  </div>
  <button class="start-btn" onclick="startApp()">📷 カメラを起動して開始</button>
</div>

<!-- ヘッダー -->
<header id="mainHeader" style="display:none">
  <div class="header-left">
    <div class="logo">📊</div>
    <h1>バーコード照合</h1>
  </div>
  <button class="end-btn" onclick="endApp()">終了</button>
</header>

<!-- カメラ -->
<div class="cam-wrap" id="camWrap" style="display:none">
  <video id="mainVideo" autoplay playsinline muted></video>

  <!-- スキャン枠オーバーレイ -->
  <div class="scan-overlay">
    <div class="scan-dim top"></div>
    <div class="scan-dim bottom"></div>
    <div class="scan-dim left"></div>
    <div class="scan-dim right"></div>
    <div class="scan-frame" id="scanFrame">
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-line"></div>
    </div>
  </div>

  <!-- ステップバー -->
  <div class="step-bar">
    <div class="step-dot active" id="dot1">1</div>
    <div class="step-line" id="line1"></div>
    <div class="step-dot wait" id="dot2">2</div>
    <div style="flex:1"></div>
    <div class="step-label" id="stepLabel">現品票をスキャン</div>
  </div>

  <!-- ガイド -->
  <div class="guide-area">
    <div class="guide-chip" id="guideChip">バーコードを枠内に合わせてください</div>
    <div class="scanned-chip" id="scannedChip"></div>
  </div>

  <!-- 手入力エリア -->
  <div class="manual-area">
    <div class="mode-toggle">
      <button class="mode-btn active" id="modeScan" onclick="setMode('scan')">📊 スキャン</button>
      <button class="mode-btn" id="modeManual" onclick="setMode('manual')">✏️ 手入力</button>
    </div>
    <div class="manual-row" id="manualRow">
      <input class="manual-input" type="text" id="manualInput" placeholder="23306M81501BC" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="manual-submit" onclick="submitManual()">確定</button>
    </div>
  </div>

  <!-- 処理フラッシュ -->
  <div class="beep-flash" id="beepFlash"></div>

  <!-- 処理中 -->
  <div class="processing" id="processing">
    <div class="processing-text">✓ スキャン完了</div>
  </div>

  <!-- 結果パネル -->
  <div class="result-panel" id="resultPanel">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-nums" id="resultNums"></div>
    <button class="result-next-btn" onclick="nextRound()">次の照合へ →</button>
    <div class="result-countdown" id="resultCountdown"></div>
  </div>
</div>

<!-- ZXing バーコードライブラリ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.21.3/zxing.min.js"></script>
<script>
let stream = null;
let codeReader = null;
let step = 1;
let nums = [null, null];
let scanning = true;
let countdownTimer = null;
let inputMode = 'scan';
let lastScanTime = 0;

// ---- 起動 ----
async function startApp() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width:{ideal:1920}, height:{ideal:1080} }
    });
    const vid = document.getElementById('mainVideo');
    vid.srcObject = stream;

    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('mainHeader').style.display = 'flex';
    document.getElementById('camWrap').style.display = 'block';

    initScanner();
    setStep(1);
  } catch(e) {
    alert('カメラにアクセスできません。\nHTTPS環境（GitHub Pages等）が必要です。\n\n' + e.message);
  }
}

function endApp() {
  stopScanner();
  if(stream) { stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if(countdownTimer) clearInterval(countdownTimer);
  document.getElementById('startScreen').style.display = 'flex';
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('camWrap').style.display = 'none';
  document.getElementById('resultPanel').classList.remove('show');
  step = 1; nums = [null, null];
}

// ---- バーコードスキャナー初期化 ----
function initScanner() {
  try {
    // ZXingが利用可能か確認
    if (typeof ZXing === 'undefined') {
      throw new Error('ZXingライブラリが読み込めませんでした');
    }
    const hints = new Map();
    const formats = [
      ZXing.BarcodeFormat.CODE_128,
      ZXing.BarcodeFormat.CODE_39,
      ZXing.BarcodeFormat.QR_CODE,
      ZXing.BarcodeFormat.DATA_MATRIX,
      ZXing.BarcodeFormat.EAN_13,
      ZXing.BarcodeFormat.EAN_8,
    ];
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
    codeReader = new ZXing.BrowserMultiFormatReader(hints, 300);
    startContinuousScan();
  } catch(e) {
    console.warn('ZXingスキャナー初期化失敗:', e);
    showScannerFallback();
  }
}

function showScannerFallback() {
  document.getElementById('guideChip').textContent = 'バーコードライブラリを読み込み中...';
  // フォールバック：手入力モードを促す
  setTimeout(() => {
    document.getElementById('guideChip').textContent = '手入力モードをご利用ください';
    setMode('manual');
  }, 3000);
}

function startContinuousScan() {
  if (!codeReader || !scanning) return;
  const vid = document.getElementById('mainVideo');

  const scanLoop = () => {
    if (!scanning || !stream) return;
    try {
      // ビデオフレームをキャンバスに描画してデコード
      const canvas = document.createElement('canvas');
      // スキャン枠（中央30%の高さ）だけを切り取る
      const vw = vid.videoWidth;
      const vh = vid.videoHeight;
      if (!vw || !vh) { requestAnimationFrame(scanLoop); return; }

      const cropTop = Math.floor(vh * 0.28);
      const cropH = Math.floor(vh * 0.34);
      canvas.width = vw;
      canvas.height = cropH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(vid, 0, cropTop, vw, cropH, 0, 0, vw, cropH);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const luminanceSource = new ZXing.HTMLCanvasElementLuminanceSource(canvas);
      const binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));

      try {
        const result = codeReader.decodeBitmap(binaryBitmap);
        if (result && result.text) {
          const now = Date.now();
          if (now - lastScanTime > 1500) { // 1.5秒に1回
            lastScanTime = now;
            onScanned(result.text.trim());
          }
        }
      } catch(e) {
        // NotFoundException は正常（バーコードが見つからない）
      }
    } catch(e) {
      // エラーは無視して継続
    }
    requestAnimationFrame(scanLoop);
  };
  requestAnimationFrame(scanLoop);
}

function stopScanner() {
  scanning = false;
  if(codeReader) { try { codeReader.reset(); } catch(e){} }
}

// ---- スキャン結果 ----
function onScanned(text) {
  if (!scanning) return;
  // フラッシュ演出
  const flash = document.getElementById('beepFlash');
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 150);

  // スキャン完了表示
  const chip = document.getElementById('scannedChip');
  chip.textContent = '✓ ' + text;
  chip.style.display = 'block';

  nums[step - 1] = text;

  if (step === 1) {
    setTimeout(() => {
      chip.style.display = 'none';
      setStep(2);
    }, 600);
  } else {
    setTimeout(() => {
      chip.style.display = 'none';
      showResult();
    }, 600);
  }
}

// ---- 手入力 ----
function setMode(mode) {
  inputMode = mode;
  document.getElementById('modeScan').classList.toggle('active', mode === 'scan');
  document.getElementById('modeManual').classList.toggle('active', mode === 'manual');
  document.getElementById('manualRow').classList.toggle('show', mode === 'manual');
  document.getElementById('manualInput').value = '';
  if (mode === 'manual') {
    document.getElementById('guideChip').textContent = step === 1 ? '現品票の製品番号を入力' : '出荷票の製品番号を入力';
  } else {
    document.getElementById('guideChip').textContent = 'バーコードを枠内に合わせてください';
  }
}

function submitManual() {
  const val = document.getElementById('manualInput').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!val) { alert('製品番号を入力してください'); return; }
  onScanned(val);
}

// ---- ステップ管理 ----
function setStep(s) {
  step = s;
  scanning = true;
  const dot1 = document.getElementById('dot1');
  const dot2 = document.getElementById('dot2');
  const line1 = document.getElementById('line1');
  const label = document.getElementById('stepLabel');
  if (s === 1) {
    dot1.className = 'step-dot active'; dot1.textContent = '1';
    dot2.className = 'step-dot wait'; dot2.textContent = '2';
    line1.className = 'step-line';
    label.textContent = '現品票をスキャン';
    if (inputMode === 'manual') {
      document.getElementById('guideChip').textContent = '現品票の製品番号を入力';
      document.getElementById('manualInput').value = '';
    }
  } else {
    dot1.className = 'step-dot done'; dot1.textContent = '✓';
    dot2.className = 'step-dot active'; dot2.textContent = '2';
    line1.className = 'step-line done';
    label.textContent = '出荷票をスキャン';
    if (inputMode === 'manual') {
      document.getElementById('guideChip').textContent = '出荷票の製品番号を入力';
      document.getElementById('manualInput').value = '';
    }
  }
}

// ---- 結果表示 ----
function showResult() {
  scanning = false;
  const n0 = nums[0], n1 = nums[1];
  const ok = n0 && n1 && n0 === n1;

  document.getElementById('resultIcon').textContent = ok ? '✅' : '❌';
  const title = document.getElementById('resultTitle');
  title.textContent = ok ? '一致　製品番号が一致しました' : '不一致　製品番号が異なります';
  title.className = `result-title ${ok ? 'ok' : 'ng'}`;

  document.getElementById('resultNums').innerHTML = `
    <div class="result-num-row">
      <div class="result-num-label">現品票</div>
      <div class="result-num-val">${n0 || '読取失敗'}</div>
    </div>
    <div class="result-num-row">
      <div class="result-num-label">出荷票</div>
      <div class="result-num-val ${!ok ? 'ng' : ''}">${n1 || '読取失敗'}</div>
    </div>`;

  document.getElementById('resultPanel').classList.add('show');

  let sec = 5;
  document.getElementById('resultCountdown').textContent = `${sec}秒後に自動で次の照合へ`;
  if (countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    sec--;
    if (sec <= 0) { clearInterval(countdownTimer); nextRound(); }
    else document.getElementById('resultCountdown').textContent = `${sec}秒後に自動で次の照合へ`;
  }, 1000);
}

function nextRound() {
  if (countdownTimer) clearInterval(countdownTimer);
  document.getElementById('resultPanel').classList.remove('show');
  nums = [null, null];
  setMode(inputMode);
  setStep(1);
}
</script>
</body>
</html>
